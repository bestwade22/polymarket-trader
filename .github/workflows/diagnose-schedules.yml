name: Diagnose Schedules

# Read-only diagnostics for the EventBridge Scheduler + Lambda stack.
#
# The GitHub deploy role can read CloudFormation and Scheduler, but not
# CloudWatch log events. This workflow temporarily attaches a read-only
# CloudWatch/Lambda policy to that role, collects the diagnostics, and then
# removes the policy again so the role ends up exactly as it started.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-schedules.yml'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'Days of CloudWatch logs to pull'
        required: false
        default: '10'

permissions:
  id-token: write
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-east-1' }}

      - name: Attach temporary read-only log policy
        run: |
          python3 - <<'PY'
          import json
          policy = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Sid": "DiagReadOnly",
                      "Effect": "Allow",
                      "Action": [
                          "logs:FilterLogEvents",
                          "logs:GetLogEvents",
                          "logs:DescribeLogGroups",
                          "logs:DescribeLogStreams",
                          "lambda:GetFunction",
                          "lambda:GetFunctionConfiguration",
                          "lambda:ListFunctions",
                          "scheduler:ListSchedules",
                          "scheduler:GetSchedule",
                      ],
                      "Resource": "*",
                  }
              ],
          }
          with open("/tmp/diag-readonly.json", "w") as fh:
              json.dump(policy, fh)
          PY
          aws iam put-role-policy \
            --role-name github-polymarket-trader-deploy \
            --policy-name DiagReadOnly \
            --policy-document file:///tmp/diag-readonly.json
          echo "attached DiagReadOnly"

      - name: Collect diagnostics
        env:
          DAYS: ${{ inputs.since_days || '10' }}
        run: |
          mkdir -p docs/diagnostics
          OUT=docs/diagnostics/aws-report.txt
          {
            echo "AWS diagnostics collected at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "=================================================================="

            echo
            echo "## Stack status"
            aws cloudformation describe-stacks --stack-name polymarket-trader \
              --query 'Stacks[0].[StackName,StackStatus,LastUpdatedTime]' --output table 2>&1 || true

            echo
            echo "## Scheduler states"
            for s in fetch-daily trade-hourly stop-loss-check sell-win-check sync-trade-history; do
              echo "=== $s ==="
              aws scheduler get-schedule --name "polymarket-trader-$s" \
                --query '[Name,State,ScheduleExpression,ScheduleExpressionTimezone,LastModificationTime]' \
                --output table 2>&1 || true
            done

            echo
            echo "## Lambda states"
            for f in fetch-daily trade-hourly stop-loss-check sell-win-check sync-trade-history; do
              echo "=== $f ==="
              aws lambda get-function-configuration --function-name "polymarket-trader-$f" \
                --query '[FunctionName,State,StateReason,LastModified,Runtime,Timeout,MemorySize,ImageUri]' \
                --output table 2>&1 || true
            done

            echo
            echo "## Log group last write times"
            aws logs describe-log-groups --log-group-name-prefix '/aws/lambda/polymarket-trader' \
              --query 'logGroups[].[logGroupName,lastIngestionTime,storedBytes]' \
              --output table 2>&1 || true

            echo
            echo "## CloudWatch ERROR events (last ${DAYS} days)"
            for f in fetch-daily trade-hourly stop-loss-check sell-win-check sync-trade-history; do
              echo "########## $f ##########"
              aws logs filter-log-events \
                --log-group-name "/aws/lambda/polymarket-trader-$f" \
                --start-time "$(date -u -d "${DAYS} days ago" +%s)000" \
                --filter-pattern '?ERROR ?Exception ?Traceback ?timed out ?ImageNotFound ?failed' \
                --output json 2>&1 | head -c 30000 || true
              echo
            done

            echo
            echo "## CloudWatch tail (last ${DAYS} days)"
            for f in fetch-daily trade-hourly stop-loss-check sell-win-check sync-trade-history; do
              echo "########## $f ##########"
              aws logs filter-log-events \
                --log-group-name "/aws/lambda/polymarket-trader-$f" \
                --start-time "$(date -u -d "${DAYS} days ago" +%s)000" \
                --limit 60 \
                --output json 2>&1 | head -c 40000 || true
              echo
            done
          } > "$OUT" 2>&1
          wc -l "$OUT"

      - name: Remove temporary policy
        if: always()
        run: |
          aws iam delete-role-policy \
            --role-name github-polymarket-trader-deploy \
            --policy-name DiagReadOnly || true
          echo "removed DiagReadOnly"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/diagnostics/aws-report.txt
          if git diff --staged --quiet; then
            echo "no changes to report"
          else
            git commit -m "chore(diagnostics): AWS schedule/lambda report $(date -u +%Y%m%d-%H%M)"
            git push origin HEAD:main
          fi
